<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Meaning Barometer</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Georgia', serif;
    background: #F7F5F0;
    color: #1C1C1C;
    min-height: 100vh;
  }
  .header {
    background: #1C1C1C;
    color: #F7F5F0;
    padding: 32px 40px;
    border-bottom: 4px solid #7B6FA0;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }
  .header h1 {
    font-size: 1.5rem;
    font-weight: normal;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .header p {
    margin-top: 8px;
    font-size: 0.9rem;
    color: #A8A8A8;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    letter-spacing: 0.03em;
    max-width: 520px;
  }
  .restart-link {
    background: none; border: none; color: #A8A8A8;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 0.78rem; letter-spacing: 0.05em; text-decoration: underline;
    cursor: pointer; flex: 0 0 auto; margin-top: 4px; white-space: nowrap;
  }
  .instructions {
    background: #EDE8F5;
    border-left: 4px solid #7B6FA0;
    padding: 20px 40px;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 0.88rem;
    line-height: 1.7;
    color: #3C3C3C;
  }
  .step-label {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 0.7rem;
    letter-spacing: 0.12em;
    color: #7B6FA0;
    text-transform: uppercase;
    display: block;
    margin-bottom: 6px;
  }
  .progress-label {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 0.78rem; color: #888;
    padding: 16px 40px 0; text-align: right;
  }
  .progress-bar-wrap { background: #E0DCF0; height: 4px; margin: 8px 40px 24px; border-radius: 2px; }
  .progress-bar { height: 4px; background: #7B6FA0; border-radius: 2px; transition: width 0.3s; }
  .container { padding: 8px 40px 24px; max-width: 860px; margin: 0 auto; }
  h1.page-title { font-size: 1.3rem; font-weight: normal; letter-spacing: 0.05em; margin: 20px 0 4px; }
  .intro-block { background: white; border: 1px solid #E0DCF0; border-radius: 2px; padding: 26px 28px; margin-top: 20px; }
  .intro-block p { font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 0.92rem; line-height: 1.8; color: #333; margin-bottom: 14px; }
  .intro-block p:last-child { margin-bottom: 0; }
  .intro-block strong { color: #1C1C1C; }

  .question-block {
    background: white; border-radius: 2px; margin-bottom: 20px; padding: 24px 28px;
    border: 1px solid #E0DCF0; transition: border-color 0.2s;
  }
  .question-block.answered { border-color: #7B6FA0; }
  .question-number {
    font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 0.7rem; letter-spacing: 0.12em;
    color: #7B6FA0; text-transform: uppercase; margin-bottom: 10px;
  }
  .question-text { font-size: 1rem; line-height: 1.65; color: #1C1C1C; margin-bottom: 20px; }
  .likert-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .likert-label { font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 0.72rem; color: #888; flex: 0 0 60px; line-height: 1.3; }
  .likert-label.right { text-align: right; }
  .likert-options { display: flex; gap: 8px; align-items: center; flex: 1; justify-content: center; flex-wrap: wrap; }
  .likert-option { display: flex; flex-direction: column; align-items: center; cursor: pointer; }
  .likert-option input[type="radio"] { display: none; }
  .likert-circle {
    width: 36px; height: 36px; border-radius: 50%; border: 2px solid #CCCAE0; background: white;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 0.8rem; color: #888;
    transition: all 0.15s; cursor: pointer;
  }
  .likert-option:hover .likert-circle { border-color: #7B6FA0; color: #7B6FA0; }
  .likert-option input[type="radio"]:checked + .likert-circle {
    background: #7B6FA0; border-color: #7B6FA0; color: white; font-weight: bold;
  }

  .vcard {
    background: white; border: 1px solid #E0DCF0; border-radius: 2px; padding: 18px 20px;
    display: flex; align-items: flex-start; gap: 14px; cursor: pointer; transition: border-color 0.2s;
    -webkit-tap-highlight-color: transparent; user-select: none; margin-bottom: 12px;
  }
  .vcard.selected { border-color: #7B6FA0; border-width: 2px; padding: 17px 19px; background: #FBFAFD; }
  .vcard .mark {
    flex: 0 0 30px; height: 30px; border-radius: 50%; border: 2px solid #CCCAE0; background: white;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 0.85rem; color: #888; margin-top: 2px;
  }
  .vcard.selected .mark { background: #7B6FA0; border-color: #7B6FA0; color: white; }
  .vcard .vc-text { font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 0.92rem; line-height: 1.6; color: #333; }

  .lever-heading {
    font-size: 1.05rem; margin: 26px 0 4px;
  }
  .lever-heading .tag {
    font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 0.7rem; color: #7B6FA0;
    text-transform: uppercase; letter-spacing: 0.08em; display: block; margin-bottom: 4px;
  }
  .lever-sub {
    font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 0.85rem; color: #666; margin-bottom: 14px;
  }

  .actions { max-width: 860px; margin: 28px auto 0; padding: 0 40px 60px; display: flex; gap: 12px; }
  .submit-btn {
    flex: 1; background: #1C1C1C; color: #F7F5F0; border: none; padding: 16px 24px;
    font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 0.9rem; letter-spacing: 0.08em;
    text-transform: uppercase; cursor: pointer; border-radius: 2px; transition: background 0.2s;
  }
  .submit-btn:hover { background: #7B6FA0; }
  .submit-btn:disabled { background: #CCCAE0; cursor: not-allowed; color: #888; }
  .restart-btn {
    background: transparent; border: 2px solid #1C1C1C; color: #1C1C1C; padding: 14px 24px;
    font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 0.85rem; letter-spacing: 0.08em;
    text-transform: uppercase; cursor: pointer; border-radius: 2px; transition: all 0.2s;
  }
  .restart-btn:hover { background: #1C1C1C; color: #F7F5F0; }

  .results-container { padding: 8px 40px 60px; max-width: 860px; margin: 0 auto; }
  .results-title { font-size: 1.3rem; font-weight: normal; letter-spacing: 0.06em; text-transform: uppercase; margin: 20px 0 8px; }
  .results-subtitle { font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 0.85rem; color: #666; margin-bottom: 30px; line-height: 1.7; }
  .section-label {
    font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 0.75rem; letter-spacing: 0.12em;
    text-transform: uppercase; color: #1C1C1C; margin: 34px 0 14px; border-top: 2px solid #E0DCF0; padding-top: 18px;
  }
  .section-label:first-of-type { border-top: none; padding-top: 0; margin-top: 0; }

  .dimension-result { background: white; border: 1px solid #E0DCF0; border-radius: 2px; padding: 22px 26px; margin-bottom: 16px; }
  .dim-header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 10px; }
  .dim-name { font-size: 1rem; letter-spacing: 0.03em; }
  .dim-score { font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 1.2rem; color: #7B6FA0; font-weight: bold; }
  .dim-score span { font-size: 0.75rem; color: #AAA; font-weight: normal; }
  .score-bar-wrap { background: #F0EEF8; height: 8px; border-radius: 4px; }
  .score-bar { height: 8px; background: #7B6FA0; border-radius: 4px; transition: width 0.8s ease; width: 0%; }

  .issue-card {
    background: #F7F3EC; border: 1px solid #E5DCC8; border-left: 4px solid #B08A3E;
    border-radius: 2px; padding: 18px 22px; margin-bottom: 12px;
    font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 0.94rem; line-height: 1.65; color: #2C2410;
  }
  .issue-card .issue-tag {
    display: block; font-size: 0.68rem; letter-spacing: 0.1em; text-transform: uppercase;
    color: #B08A3E; margin-bottom: 6px;
  }
  .no-issues {
    font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 0.9rem; color: #444;
    background: white; border: 1px solid #E0DCF0; border-radius: 2px; padding: 20px 24px; line-height: 1.7;
  }

  .grant-block {
    background: #EDE8F5; border-left: 4px solid #7B6FA0; padding: 22px 26px; border-radius: 2px;
    font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 0.9rem; line-height: 1.75; color: #3C3C3C;
  }
  .grant-block strong { color: #1C1C1C; }

  .save-btn {
    margin-top: 28px; background: #7B6FA0; border: none; color: #F7F5F0; padding: 16px 36px;
    font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 0.85rem; letter-spacing: 0.08em;
    text-transform: uppercase; cursor: pointer; border-radius: 2px; transition: all 0.2s; width: 100%;
  }
  .save-btn:hover { background: #5A4E80; }
  .save-instructions {
    margin-top: 16px; background: #F0EEF8; border: 1px solid #D8D0F0; border-radius: 2px; padding: 18px 20px;
    font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 0.82rem; line-height: 1.7; color: #444; display: none;
  }
  .save-instructions strong { color: #1C1C1C; display: block; margin-bottom: 6px; font-size: 0.78rem; letter-spacing: 0.06em; text-transform: uppercase; }
  .save-instructions ol { padding-left: 18px; margin-top: 6px; }
  .save-instructions ol li { margin-bottom: 4px; }
  .begin-again-btn { margin-top: 12px; width: 100%; }

  @media print {
    .actions, .restart-link, .save-btn, .save-instructions, .progress-bar-wrap, .progress-label { display: none; }
    body { background: white; }
    .header { background: #1C1C1C !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
</head>
<body>
<div class="header">
  <div>
    <h1>The Meaning Barometer</h1>
    <p>A capstone to Knowing Yourself. Where is your sense of meaning actually coming from, and is it built to last?</p>
  </div>
  <button class="restart-link" id="restartBtn">Start over</button>
</div>
<div id="app"></div>

<script>
const LEVERS = [
  {id:'acceptance',    name:'Self-Acceptance', statement:'I accept myself, including my flaws and limitations, without harsh self-judgment.',
    build:"You need to work on accepting yourself, limitations included, without harsh self-judgment.",
    release:{
      controlling:"You need to stop requiring things to go a certain way before you can feel okay about yourself.",
      complying:"You need to stop basing your sense of self-worth on others' approval.",
      protecting:"You need to stop avoiding self-reflection and look more honestly at yourself."
    }},
  {id:'relationships', name:'Relationships', statement:'I have relationships in my life that are trusting, warm, and mutual.',
    build:"You need to create deeper, more trusting connections with people.",
    release:{
      controlling:"You need to stop requiring relationships to go a certain way to feel secure in them, and let them be more mutual.",
      complying:"You need to stop staying close to people just to avoid conflict, and risk more honesty.",
      protecting:"You need to let people get closer instead of keeping them at a safe distance."
    }},
  {id:'mastery',       name:'Mastery', statement:'I feel capable of influencing the events and circumstances that affect my life.',
    build:"You need to find real ways to exercise more influence over what happens in your life.",
    release:{
      controlling:"You need to stop requiring outcomes to go your way to feel capable, and trust your ability to influence rather than control the result.",
      complying:"You need to stop requiring others' approval to feel capable.",
      protecting:"You need to take on stretch challenges instead of avoiding risk to protect your track record."
    }},
  {id:'growth',        name:'Growth', statement:'I am actively developing toward my fuller potential, not just maintaining the status quo.',
    build:"You need to stretch toward your fuller potential rather than just maintaining what you already have.",
    release:{
      controlling:"You need to stop measuring your growth by results and validation, and value the process of stretching itself.",
      complying:"You need to grow in directions that are genuinely yours, not just what others expect.",
      protecting:"You need to take on growth that requires some vulnerability, not just safe improvement."
    }},
  {id:'purpose',       name:'Purpose', statement:'My day-to-day life is organized around something that feels genuinely worth doing.',
    build:"You need to get clearer on what you want your life to be organized around.",
    release:{
      controlling:"You need to stop requiring your impact to be visibly recognized to feel your purpose is valid.",
      complying:"You need to check whether your sense of purpose is truly yours, not inherited from others' expectations.",
      protecting:"You need to pursue a bigger, riskier version of your purpose instead of a safe, small one."
    }}
];

const REACTIVE_PROMPTS = [
  {type:'controlling', text:"A part of me needs this to go the way I want, or I feel unsettled."},
  {type:'complying',    text:"A part of me does this to stay liked and avoid friction."},
  {type:'protecting',   text:"A part of me does this to avoid depending on others, or being let down."}
];

let state = {};
function resetState(){
  state = { phase:'intro', scores:{}, reactiveLevers:[], reactiveSelections:{}, grantChoice:null };
}
resetState();

const app = document.getElementById('app');
document.getElementById('restartBtn').addEventListener('click', ()=>{
  if(state.phase==='intro' || confirm('Start over from the beginning?')){ resetState(); render(); }
});

function byId(id){ return LEVERS.find(l=>l.id===id); }

function render(){
  if(state.phase==='intro') return renderIntro();
  if(state.phase==='barometer') return renderBarometer();
  if(state.phase==='reactive') return renderReactive();
  if(state.phase==='grant') return renderGrant();
  if(state.phase==='results') return renderResults();
}

function progress(pct, label){
  return `<div class="progress-label">${label}</div>
    <div class="progress-bar-wrap"><div class="progress-bar" style="width:${pct}%"></div></div>`;
}

function renderIntro(){
  app.innerHTML = `
    <div class="instructions">
      We don't find meaning, we create it through what we invest our attention, relationships, and effort in.
      This capstone has three short parts, and closes with a personal read on where to focus next.
    </div>
    <div class="container">
      <h1 class="page-title">Before you begin</h1>
      <div class="intro-block">
        <p><strong>Part 1. The Barometer.</strong> Rate five levers that research links to a well-lived life: self-acceptance, relationships, mastery, growth, and purpose.</p>
        <p><strong>Part 2. The Reactive Check.</strong> For whichever levers score highest, we'll check whether that strength is genuinely chosen, or a self-protective habit (complying, protecting, or controlling) borrowed from Kegan's Socialised patterns.</p>
        <p><strong>Part 3. The Grant Study Check.</strong> A single question comparing where your time and energy actually go against what the longest-running study of adult wellbeing found matters most.</p>
      </div>
    </div>
    <div class="actions"><button class="submit-btn" id="beginBtn">Begin</button></div>
  `;
  document.getElementById('beginBtn').addEventListener('click', ()=>{ state.phase='barometer'; render(); });
}

function renderBarometer(){
  const answeredCount = Object.keys(state.scores).length;
  const blocks = LEVERS.map((lever, idx)=>{
    const answered = state.scores[lever.id] !== undefined;
    const opts = [1,2,3,4,5,6,7].map(v=>{
      const checked = state.scores[lever.id]===v ? 'checked' : '';
      return `<label class="likert-option">
        <input type="radio" name="${lever.id}" value="${v}" ${checked} data-lever="${lever.id}" data-val="${v}">
        <div class="likert-circle">${v}</div>
      </label>`;
    }).join('');
    return `<div class="question-block ${answered?'answered':''}">
      <div class="question-number">Lever ${String(idx+1).padStart(2,'0')}: ${lever.name}</div>
      <div class="question-text">${lever.statement}</div>
      <div class="likert-row">
        <div class="likert-label">Low</div>
        <div class="likert-options">${opts}</div>
        <div class="likert-label right">High</div>
      </div>
    </div>`;
  }).join('');

  app.innerHTML = `
    <div class="instructions"><span class="step-label">Part 1 of 3</span>Rate each statement from 1 (low) to 7 (high), based on how true it feels right now.</div>
    ${progress((answeredCount/LEVERS.length)*100, answeredCount+' of '+LEVERS.length+' answered')}
    <div class="container">${blocks}</div>
    <div class="actions"><button class="submit-btn" id="nextBtn" ${answeredCount===LEVERS.length?'':'disabled'}>Continue</button></div>
  `;

  app.querySelectorAll('input[type=radio]').forEach(inp=>{
    inp.addEventListener('change', ()=>{
      state.scores[inp.dataset.lever] = parseInt(inp.dataset.val, 10);
      renderBarometer();
    });
  });
  const nextBtn = document.getElementById('nextBtn');
  if(nextBtn) nextBtn.addEventListener('click', ()=>{
    if(Object.keys(state.scores).length===LEVERS.length){
      const sorted = LEVERS.map(l=>({id:l.id, score:state.scores[l.id]}))
        .sort((a,b)=>b.score-a.score)
        .filter(x=>x.score>=5);
      state.reactiveLevers = sorted.slice(0,2).map(x=>x.id);
      state.reactiveSelections = {};
      state.reactiveLevers.forEach(id=> state.reactiveSelections[id] = []);
      state.phase = state.reactiveLevers.length ? 'reactive' : 'grant';
      render();
    }
  });
}

function renderReactive(){
  const sections = state.reactiveLevers.map(id=>{
    const lever = byId(id);
    const prompts = REACTIVE_PROMPTS.map(p=>{
      const selected = state.reactiveSelections[id].includes(p.type);
      return `<div class="vcard ${selected?'selected':''}" data-lever="${id}" data-type="${p.type}">
        <div class="mark">${selected?'✓':''}</div>
        <div class="vc-text">${p.text}</div>
      </div>`;
    }).join('');
    return `<div class="lever-heading"><span class="tag">Scored high: ${lever.name}</span>${lever.statement}</div>
      <div class="lever-sub">Tap anything below that feels true, or leave all unselected if none does.</div>
      ${prompts}`;
  }).join('');

  app.innerHTML = `
    <div class="instructions"><span class="step-label">Part 2 of 3</span>A strength can still be a self-protective habit in disguise. Let's check.</div>
    <div class="container">${sections}</div>
    <div class="actions">
      <button class="restart-btn" id="backBtn">Back</button>
      <button class="submit-btn" id="nextBtn">Continue</button>
    </div>
  `;

  app.querySelectorAll('.vcard[data-lever]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const lever = el.dataset.lever, type = el.dataset.type;
      const arr = state.reactiveSelections[lever];
      const idx = arr.indexOf(type);
      if(idx>-1) arr.splice(idx,1); else arr.push(type);
      renderReactive();
    });
  });
  document.getElementById('backBtn').addEventListener('click', ()=>{ state.phase='barometer'; render(); });
  document.getElementById('nextBtn').addEventListener('click', ()=>{ state.phase='grant'; render(); });
}

function renderGrant(){
  const options = [
    {id:'achievement', text:'Achievement and output: getting things done, results, status.'},
    {id:'relationships', text:'Relationships and connection: the people in my life.'},
    {id:'balanced', text:"Fairly balanced between the two."}
  ];
  const cards = options.map(o=>{
    const selected = state.grantChoice===o.id;
    return `<div class="vcard ${selected?'selected':''}" data-choice="${o.id}">
      <div class="mark">${selected?'✓':''}</div>
      <div class="vc-text">${o.text}</div>
    </div>`;
  }).join('');

  app.innerHTML = `
    <div class="instructions"><span class="step-label">Part 3 of 3</span>The Grant Study, Harvard's 80+ year study of adult development, found that relationship quality, more than achievement or wealth, predicts a well-lived life. Where does most of your time and energy actually go right now?</div>
    <div class="container">${cards}</div>
    <div class="actions">
      <button class="restart-btn" id="backBtn">Back</button>
      <button class="submit-btn" id="nextBtn" ${state.grantChoice?'':'disabled'}>See my results</button>
    </div>
  `;

  app.querySelectorAll('.vcard[data-choice]').forEach(el=>{
    el.addEventListener('click', ()=>{
      state.grantChoice = el.dataset.choice;
      renderGrant();
    });
  });
  document.getElementById('backBtn').addEventListener('click', ()=>{
    state.phase = state.reactiveLevers.length ? 'reactive' : 'barometer';
    render();
  });
  document.getElementById('nextBtn').addEventListener('click', ()=>{
    if(state.grantChoice){ state.phase='results'; render(); }
  });
}

function renderResults(){
  // Sort levers low to high so the barometer and the issues list read in the same order
  const sortedLevers = [...LEVERS].sort((a,b)=>state.scores[a.id]-state.scores[b.id]);

  const dimBlocks = sortedLevers.map(l=>{
    const score = state.scores[l.id];
    const pct = ((score-1)/6)*100;
    return `<div class="dimension-result">
      <div class="dim-header">
        <div class="dim-name">${l.name}</div>
        <div class="dim-score">${score} <span>/ 7</span></div>
      </div>
      <div class="score-bar-wrap"><div class="score-bar" data-width="${pct}%"></div></div>
    </div>`;
  }).join('');

  // Issues to address, built in the same low-to-high lever order as the barometer above.
  // Each lever contributes its Build item (score <= 4) or its selected Release item(s) (score >= 5), never both.
  const buildIssues = [];
  const releaseIssues = [];
  sortedLevers.forEach(l=>{
    const score = state.scores[l.id];
    if(score<=4){
      buildIssues.push({tag:'Build: '+l.name, text:l.build});
    } else if(state.reactiveLevers.includes(l.id)){
      state.reactiveSelections[l.id].forEach(type=>{
        releaseIssues.push({tag:'Release: '+l.name, text:l.release[type]});
      });
    }
  });

  // Grant issue
  let grantHTML;
  if(state.grantChoice==='achievement'){
    grantHTML = `<div class="grant-block"><strong>Worth noticing:</strong> most of your time and energy currently goes toward achievement and output. The Grant Study's clearest finding is that relationship quality, not achievement, is what most strongly predicts a well-lived life. You may want to redirect more of your time and energy toward deepening your relationships.</div>`;
  } else if(state.grantChoice==='relationships'){
    grantHTML = `<div class="grant-block"><strong>Worth noticing:</strong> your time and energy already lean toward relationships and connection, which is exactly what the Grant Study found matters most for a well-lived life. Worth protecting that investment deliberately.</div>`;
  } else {
    grantHTML = `<div class="grant-block"><strong>Worth noticing:</strong> you describe a fairly balanced investment of time and energy. The Grant Study found relationship quality to be the strongest predictor of a well-lived life, a useful check as you decide where balance tips next.</div>`;
  }

  const allIssues = [...buildIssues, ...releaseIssues];
  const issuesHTML = allIssues.length
    ? allIssues.map(i=>`<div class="issue-card"><span class="issue-tag">${i.tag}</span>${i.text}</div>`).join('')
    : `<div class="no-issues">No strong signals of reactive patterns or low levers right now. The more useful question may simply be which of these five you want to deepen next.</div>`;

  app.innerHTML = `
    <div class="results-container">
      <div class="results-title">My Meaning Profile</div>
      <div class="results-subtitle">This builds on what you explored in Knowing Yourself, not just how you experience each dimension of existence, but where your sense of meaning is actually coming from today, and whether it's built to last.</div>

      <div class="section-label">The Barometer</div>
      ${dimBlocks}

      <div class="section-label">Where To Focus</div>
      ${issuesHTML}

      <div class="section-label">The Grant Study Check</div>
      ${grantHTML}

      <button class="save-btn" id="saveBtn">📋  Save My Results</button>
      <div class="save-instructions" id="saveInstructions"></div>
      <button class="restart-btn begin-again-btn" id="restartBtn2">Begin Again</button>
    </div>
  `;

  setTimeout(()=>{
    document.querySelectorAll('.score-bar').forEach(bar=>{ bar.style.width = bar.getAttribute('data-width'); });
  }, 150);

  document.getElementById('restartBtn2').addEventListener('click', ()=>{ resetState(); render(); });

  const saveBtn = document.getElementById('saveBtn');
  const saveInstructions = document.getElementById('saveInstructions');
  var isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);
  var isAndroid = /Android/i.test(navigator.userAgent);
  var deviceTitle, deviceSteps;
  if (isIOS) {
    deviceTitle = 'On iPhone or iPad';
    deviceSteps = [
      'Press the side button and volume-up button at the same time (iPhone X and later), or the home button and side button together (older iPhones).',
      'A thumbnail appears in the bottom-left corner, tap it to view and annotate if you wish.',
      'The screenshot saves automatically to your Photos app.',
      'You can also tap Share and email it to yourself or your facilitator.'
    ];
  } else if (isAndroid) {
    deviceTitle = 'On Android';
    deviceSteps = [
      'Hold the power button and volume-down button simultaneously for one to two seconds.',
      'A screenshot notification appears, tap it to view or share.',
      'The image saves to your Photos or Gallery app.',
      'Use the Share option to email it to yourself or your facilitator directly.'
    ];
  } else {
    deviceTitle = 'On a laptop or desktop';
    deviceSteps = [
      "Use your browser's Print function (Ctrl+P on Windows, Cmd+P on Mac) and choose \"Save as PDF.\"",
      'Save the PDF to your device or cloud storage.',
      'Alternatively, take a screenshot: on Mac use Cmd+Shift+4 to select an area; on Windows use the Snipping Tool or Win+Shift+S.'
    ];
  }
  var stepsHTML = deviceSteps.map(s=>'<li>'+s+'</li>').join('');
  saveInstructions.innerHTML =
    '<strong>'+deviceTitle+': Screenshot Instructions</strong>' +
    '<ol>'+stepsHTML+'</ol>' +
    '<p style="margin-top:10px; color:#666;">Your results are private. Nothing has been sent anywhere. A screenshot captures exactly what is on your screen right now. You can share it with a facilitator or keep it for yourself.</p>';
  saveBtn.onclick = function(){
    var open = saveInstructions.style.display === 'block';
    saveInstructions.style.display = open ? 'none' : 'block';
    saveBtn.textContent = open ? '📋  Save My Results' : '✕  Close Instructions';
    if(!open) saveInstructions.scrollIntoView({behavior:'smooth', block:'nearest'});
  };
}

render();
</script>
</body>
</html>
